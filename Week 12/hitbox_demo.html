<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pygame Physics: Hitboxes & Collisions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        h1 { color: #facc15; text-align: center; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-top: 0; margin-bottom: 20px; }

        .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

        /* --- THE CANVAS AREA --- */
        .canvas-panel { background: #1e293b; padding: 20px; border-radius: 12px; border: 4px solid #475569; }
        
        .grid-container {
            width: 100%; height: 400px; 
            background-color: #000;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 25px 25px;
            position: relative;
            border: 2px solid #334155;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Objects */
        .hitbox {
            position: absolute;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: monospace; font-weight: bold; font-size: 0.9rem;
            text-shadow: 1px 1px 2px black;
        }

        #player {
            background: rgba(56, 189, 248, 0.8);
            border: 3px solid #0284c7;
            width: 60px; height: 60px;
            z-index: 10;
        }

        #coin {
            background: rgba(250, 204, 21, 0.8);
            border: 3px solid #ca8a04;
            border-radius: 50%; /* Make it look like a coin */
            width: 40px; height: 40px;
            transition: all 0.2s ease-out;
            z-index: 5;
        }
        
        /* Show the actual square hitbox of the circular coin */
        #coin::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border: 2px dashed #ca8a04;
            border-radius: 0;
        }

        /* --- CONTROLS & LOGIC AREA --- */
        .controls-panel { background: #000; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 20px; }
        
        .code-block { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid #38bdf8; font-family: monospace; font-size: 1.1rem; color: #cbd5e1; }
        .keyword { color: #c678dd; }
        .variable { color: #e06c75; }
        .method { color: #61afef; }

        .collision-status {
            padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.2rem;
            background: #1e293b; color: #94a3b8; border: 2px solid #334155; transition: 0.2s;
            display: flex; flex-direction: column; gap: 5px;
        }
        .collision-status.active {
            background: #22c55e; color: #000; border-color: #16a34a; box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            transform: scale(1.05);
        }
        
        .score-board { font-size: 2rem; color: #facc15; text-align: center; font-family: monospace; font-weight: bold; margin-top: auto;}
        .keyboard-hint { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-top: 10px;}

    </style>
</head>
<body>
<div class="container">
    <h1>💥 Collision Detection</h1>
    
    <div class="layout">
        <!-- Canvas -->
        <div class="canvas-panel">
            <div class="grid-container" id="grid" tabindex="0">
                <div class="hitbox" id="coin">Coin</div>
                <div class="hitbox" id="player">P1</div>
            </div>
            <div class="keyboard-hint">Click the grid and use WASD or Arrow Keys to move.</div>
        </div>

        <!-- Controls -->
        <div class="controls-panel">
            
            <div class="code-block" id="code-snippet">
                <span class="keyword">if</span> player_rect.<span class="method">colliderect</span>(coin_rect):<br>
                &nbsp;&nbsp;&nbsp;&nbsp;score += <span class="variable">1</span><br>
                &nbsp;&nbsp;&nbsp;&nbsp;<span class="method">move_coin_randomly</span>()
            </div>

            <div class="collision-status" id="status-box">
                <span>colliderect == False</span>
                <span style="font-size: 0.8rem; font-weight: normal;">(No overlap detected)</span>
            </div>

            <div class="score-board">
                SCORE: <span id="score-display">0</span>
            </div>
            
            <button onclick="resetDemo()" style="padding: 10px; background: #334155; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px;">Reset Score</button>
        </div>
    </div>
</div>

<script>
    const grid = document.getElementById('grid');
    const player = document.getElementById('player');
    const coin = document.getElementById('coin');
    const statusBox = document.getElementById('status-box');
    const scoreDisplay = document.getElementById('score-display');
    const codeSnippet = document.getElementById('code-snippet');

    // State
    let px = 50, py = 50;
    let cx = 300, cy = 200;
    let pw = 60, ph = 60;
    let cw = 40, ch = 40;
    let speed = 8;
    let score = 0;

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, a: false, s: false, d: false };

    // Movement Listeners
    grid.addEventListener('keydown', (e) => { 
        if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) { e.preventDefault(); }
        if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
            keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true; 
        }
    });
    grid.addEventListener('keyup', (e) => { 
        if (keys.hasOwnProperty(e.key) || keys.hasOwnProperty(e.key.toLowerCase())) {
            keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; 
        }
    });

    // Make canvas focusable for keyboard events
    grid.focus();

    function update() {
        // 1. Move Player
        if (keys.ArrowUp || keys.w) py -= speed;
        if (keys.ArrowDown || keys.s) py += speed;
        if (keys.ArrowLeft || keys.a) px -= speed;
        if (keys.ArrowRight || keys.d) px += speed;

        // Boundary constraint (keep inside grid for visual sanity)
        px = Math.max(0, Math.min(px, grid.clientWidth - pw));
        py = Math.max(0, Math.min(py, grid.clientHeight - ph));

        // 2. Collision Detection Math (Axis-Aligned Bounding Box)
        // This is exactly what Pygame's colliderect() does under the hood!
        let isColliding = (
            px < cx + cw &&
            px + pw > cx &&
            py < cy + ch &&
            py + ph > cy
        );

        // 3. Handle Collision Trigger
        if (isColliding) {
            statusBox.classList.add('active');
            statusBox.innerHTML = `<span>colliderect == True</span><span style="font-size: 0.8rem; font-weight: normal;">(Hitboxes overlapping!)</span>`;
            codeSnippet.style.borderLeftColor = "#22c55e";
            
            // Execute the code block logic
            score++;
            scoreDisplay.innerText = score;
            
            // Teleport coin
            cx = Math.floor(Math.random() * (grid.clientWidth - cw));
            cy = Math.floor(Math.random() * (grid.clientHeight - ch));
        } else {
            statusBox.classList.remove('active');
            statusBox.innerHTML = `<span>colliderect == False</span><span style="font-size: 0.8rem; font-weight: normal;">(No overlap detected)</span>`;
            codeSnippet.style.borderLeftColor = "#38bdf8";
        }

        // 4. Update DOM
        player.style.left = px + 'px';
        player.style.top = py + 'px';
        coin.style.left = cx + 'px';
        coin.style.top = cy + 'px';

        requestAnimationFrame(update);
    }

    function resetDemo() {
        score = 0;
        scoreDisplay.innerText = score;
        px = 50; py = 50;
        grid.focus();
    }

    // Start loop
    update();
</script>
</body>
</html>
